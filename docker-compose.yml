version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbanease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbanease
      POSTGRES_USER: urbanease
      POSTGRES_PASSWORD: urbanease
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urbanease -d urbanease']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
